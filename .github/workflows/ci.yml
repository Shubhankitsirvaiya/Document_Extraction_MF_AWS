name: CI - Test and Package Serverless Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --frozen

      - name: Run no-cost quality gates
        run: |
          uv run ruff check .
          uv run pytest

      - name: Build Linux Lambda and AgentCore packages
        run: uv run python scripts/build_packages.py

      - name: Explain the deployment boundary
        run: |
          echo "Serverless packages built successfully for commit ${GITHUB_SHA}."
          echo "CI does not authenticate to AWS and does not deploy resources."
