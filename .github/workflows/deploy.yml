name: Manual - Publish Image and Deploy AWS

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to create/update AWS resources"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-dev-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  AWS_PROFILE: ""
  CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
  CDK_DEFAULT_REGION: ap-southeast-2
  EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: mf-prospectus
  ENVIRONMENT: dev
  BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
  UI_ALLOWED_CIDR: ${{ vars.UI_ALLOWED_CIDR }}

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Require explicit deployment confirmation
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Deployment is restricted to the main branch."
            exit 1
          }
          test "${{ inputs.confirmation }}" = "DEPLOY" || {
            echo "Deployment cancelled: confirmation must be exactly DEPLOY."
            exit 1
          }

      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Node.js for AWS CDK
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Validate repository variables and AWS account
        shell: bash
        run: |
          test -n "$AWS_ACCOUNT_ID" || { echo "Missing AWS_ACCOUNT_ID variable"; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "Missing AWS_DEPLOY_ROLE_ARN variable"; exit 1; }
          test -n "$BEDROCK_MODEL_ID" || { echo "Missing BEDROCK_MODEL_ID variable"; exit 1; }
          test -n "$UI_ALLOWED_CIDR" || { echo "Missing UI_ALLOWED_CIDR variable"; exit 1; }
          aws sts get-caller-identity --query Account --output text | grep -Fx "$AWS_ACCOUNT_ID"

      - name: Install dependencies and run tests
        run: |
          uv sync --frozen
          npm ci
          uv run ruff check .
          uv run pytest

      - name: Build Linux Lambda and AgentCore packages
        run: uv run python scripts/build_packages.py

      - name: Deploy core stack and create the ECR repository
        env:
          ENABLE_ECS_UI: "false"
        run: |
          npx cdk deploy "${PROJECT_NAME}-${ENVIRONMENT}-core" \
            --require-approval never \
            --outputs-file generated/core-outputs.json

      - name: Read the ECR repository from CloudFormation
        id: repository
        shell: bash
        run: |
          REPOSITORY_URI="$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-core" \
            --query "Stacks[0].Outputs[?OutputKey=='UiRepositoryUri'].OutputValue | [0]" \
            --output text)"
          test -n "$REPOSITORY_URI" && test "$REPOSITORY_URI" != "None"
          echo "uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable commit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: true
          tags: ${{ steps.repository.outputs.uri }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Deploy Fargate UI using this commit image
        env:
          ENABLE_ECS_UI: "true"
          UI_IMAGE_TAG: ${{ github.sha }}
        run: |
          npx cdk deploy "${PROJECT_NAME}-${ENVIRONMENT}-ui" \
            --require-approval never \
            --outputs-file generated/ui-outputs.json

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## AWS deployment completed"
            echo "- Image: \`${{ steps.repository.outputs.uri }}:${GITHUB_SHA}\`"
            echo "- Region: \`${AWS_REGION}\`"
            echo "- Core stack: \`${PROJECT_NAME}-${ENVIRONMENT}-core\`"
            echo "- UI stack: \`${PROJECT_NAME}-${ENVIRONMENT}-ui\`"
          } >> "$GITHUB_STEP_SUMMARY"
