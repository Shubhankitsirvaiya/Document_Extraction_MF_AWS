name: Manual - Deploy Serverless AWS Backend

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to create/update AWS resources"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-dev-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  AWS_PROFILE: ""
  CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
  CDK_DEFAULT_REGION: ap-southeast-2
  EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: mf-prospectus
  ENVIRONMENT: dev
  BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
  BEDROCK_MODEL_RESOURCE_ARNS: ${{ vars.BEDROCK_MODEL_RESOURCE_ARNS }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Require explicit deployment confirmation
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Deployment is restricted to the main branch."
            exit 1
          }
          test "${{ inputs.confirmation }}" = "DEPLOY" || {
            echo "Deployment cancelled: confirmation must be exactly DEPLOY."
            exit 1
          }

      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Node.js for AWS CDK
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Validate repository variables and AWS account
        shell: bash
        run: |
          test -n "$AWS_ACCOUNT_ID" || { echo "Missing AWS_ACCOUNT_ID variable"; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "Missing AWS_DEPLOY_ROLE_ARN variable"; exit 1; }
          test -n "$BEDROCK_MODEL_ID" || { echo "Missing BEDROCK_MODEL_ID variable"; exit 1; }
          test -n "$BEDROCK_MODEL_RESOURCE_ARNS" || { echo "Missing BEDROCK_MODEL_RESOURCE_ARNS variable"; exit 1; }
          aws sts get-caller-identity --query Account --output text | grep -Fx "$AWS_ACCOUNT_ID"

      - name: Install dependencies and run tests
        run: |
          uv sync --frozen
          npm ci
          uv run ruff check .
          uv run pytest

      - name: Build Linux Lambda and AgentCore packages
        run: uv run python scripts/build_packages.py

      - name: Deploy serverless core stack
        run: |
          npx cdk deploy "${PROJECT_NAME}-${ENVIRONMENT}-core" \
            --require-approval never \
            --outputs-file generated/core-outputs.json

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## AWS deployment completed"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Region: \`${AWS_REGION}\`"
            echo "- Core stack: \`${PROJECT_NAME}-${ENVIRONMENT}-core\`"
          } >> "$GITHUB_STEP_SUMMARY"
