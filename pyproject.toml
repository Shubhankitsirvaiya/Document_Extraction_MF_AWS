[project]
name = "mf-prospectus-restriction-extractor"
version = "0.1.0"
description = "LangGraph and AWS AgentCore demo for extracting mutual-fund prospectus restrictions"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "bedrock-agentcore>=1.25,<1.26",
  "boto3>=1.40,<2",
  "botocore>=1.40,<2",
  "langgraph>=1.2,<1.3",
  "pandas>=2.3,<3",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "pymupdf>=1.26,<2",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "streamlit>=1.50,<2",
  "tenacity>=9,<10",
]

[dependency-groups]
dev = [
  "aws-cdk-lib==2.275.0",
  "constructs>=10.4,<11",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[project.scripts]
mf-local = "scripts.run_local:main"
mf-ui = "scripts.run_ui:main"
mf-evaluate = "scripts.evaluate:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "lambdas", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: local integration tests with no paid cloud calls",
  "live: explicit opt-in tests that may call AWS and incur charges",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true

